name: mf01sm v4 stage upload

on:
  push:
    branches: [feature/mf01sm-v4]
    paths:
      - .github/workflows/mf01sm-v4-stage-upload.yml

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mf01sm-v4
          fetch-depth: 0
      - name: Assert assembled v4 source
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/mf01sm/src/v4-model.js
          test -f scripts/mf01sm-v4-regressions.mjs
          test ! -d .v4parts
          grep -Fq 'mf01sm-v4-independent-leaf' apps/mf01sm/src/v4-model.js
          grep -Fq 'mf01sm-v4-leaf-history' scripts/generate-mf01sm-current.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Full repository check
        run: pnpm check
      - name: Capture and upload exact Worker bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mf01sm-v4-out
          mkdir -p /tmp/mf01sm-v4-out
          pnpm --dir apps/web exec wrangler deploy --dry-run --cwd ../mf01sm --config wrangler.toml --name mf01sm --outdir /tmp/mf01sm-v4-out
          bundle="$(find /tmp/mf01sm-v4-out -type f -name '*.js' | head -n 1)"
          test -n "$bundle"
          grep -Fq '4.0.0' "$bundle"
          grep -Fq 'mf01sm-v4-independent-leaf' "$bundle"
          grep -Fq 'mf01sm-v4-leaf-history' "$bundle"
          bytes="$(wc -c < "$bundle" | tr -d ' ')"
          sha="$(sha256sum "$bundle" | awk '{print $1}')"
          response="$(curl --fail-with-body --silent --show-error --request POST --data-binary @"$bundle" 'https://mf01sm-v4-stage-aug16-b7e9.meteor-lab.workers.dev/upload-7d4f1e6c5a')"
          printf '%s\n' "$response"
          node -e 'const r=JSON.parse(process.argv[1]);if(!r.ok||String(r.bytes)!==process.argv[2]||r.sha256!==process.argv[3])process.exit(1)' "$response" "$bytes" "$sha"
          mkdir -p .deploy
          printf '%s\n' "$response" > .deploy/mf01sm-v4-stage-upload.json
          printf '%s %s\n' "$bytes" "$sha" > .deploy/mf01sm-v4-stage-meta.txt
      - name: Record upload proof and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f .deploy/mf01sm-v4-stage-upload.json .deploy/mf01sm-v4-stage-meta.txt
          git rm .github/workflows/mf01sm-v4-stage-upload.yml
          git commit -m 'Verify and stage mf01sm v4.0.0 bundle'
          git push origin HEAD:feature/mf01sm-v4
