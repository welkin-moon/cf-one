name: mf01sm v4.0.3 location gate

on:
  push:
    branches: [fix/mf01sm-v4.0.3-location-gate]
    paths:
      - .github/workflows/mf01sm-v403-location.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mf01sm-v4.0.3-location-gate
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply narrow 4.0.3 patch
        run: node scripts/_patch-mf01sm-v403-location.mjs
      - name: Generate and run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-mf01sm-current.mjs
          node scripts/mf01sm-v4-regressions.mjs
      - run: pnpm install --frozen-lockfile
      - name: Full repository check
        run: pnpm check
      - name: Commit verified source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/mf01sm/src/v4-model.js apps/mf01sm/src/current-runtime.js scripts/generate-mf01sm-current.mjs scripts/mf01sm-v4-regressions.mjs scripts/deploy-mf01sm-runtime.mjs
          git rm -f scripts/_patch-mf01sm-v403-location.mjs .github/workflows/mf01sm-v403-location.yml
          git commit -m 'Require location permission before mf01sm 4.0.3 questionnaire'
          git push origin HEAD:fix/mf01sm-v4.0.3-location-gate
