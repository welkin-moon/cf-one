name: mf01sm v4.0.1 UI cleanup

on:
  push:
    branches: [fix/mf01sm-v401-ui-cleanup]
    paths:
      - .github/workflows/mf01sm-v401-ui-cleanup.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mf01sm-v401-ui-cleanup
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply minimal 4.0.1 frontend cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:90]!r}')
              p.write_text(s.replace(old, new))

          # Version bump only; schemas/scoring contracts stay unchanged.
          replace_once('apps/mf01sm/src/v4-model.js', "export const V4_VERSION = '4.0.0';", "export const V4_VERSION = '4.0.1';")
          replace_once('apps/mf01sm/src/current-runtime.js', "const VERSION = '4.0.0';", "const VERSION = '4.0.1';")
          replace_once('scripts/deploy-mf01sm-runtime.mjs', "const VERSION = '4.0.0';", "const VERSION = '4.0.1';")
          replace_once('scripts/deploy-mf01sm-runtime.mjs', "'4.0.0','mf01sm-v4-independent-leaf','mixed-v4-stable-reuse','mf01sm-v4-leaf-history',", "'4.0.1','mf01sm-v4-independent-leaf','mixed-v4-stable-reuse',")
          replace_once('scripts/deploy-mf01sm-runtime.mjs', "const message = 'mf01sm v4.0.0 independent leaf scoring, complete stats, blurred flag, and v4.x answer migration';", "const message = 'mf01sm v4.0.1 frontend copy cleanup';")
          replace_once('scripts/deploy-mf01sm-runtime.mjs', "console.log(`mf01sm v${VERSION} runtime ${version.id} deployed at 100%; independent leaf scoring and v4.x stable-answer migration are live.`);", "console.log(`mf01sm v${VERSION} runtime ${version.id} deployed at 100%.`);")

          g = 'scripts/generate-mf01sm-current.mjs'
          replace_once(g, 'const questionsJson = JSON.stringify(V4_QUESTIONS);', "const questionsJson = JSON.stringify(V4_QUESTIONS.map(({ origin, ...question }) => question));")
          replace_once(g, 'const scoreSource = scoreV4Answers.toString();\nconst classifySource = classifyV4Result.toString();', "const browserSource = fn => fn.toString().replace(/^\\s*\\/\\/.*$/gm, '');\nconst scoreSource = browserSource(scoreV4Answers);\nconst classifySource = browserSource(classifyV4Result);")

          visible_replacements = {
              'v4 把 0 / 1、男子气 / 女子气、S / M、男性吸引 / 女性吸引、单偶 / 多偶都拆成独立分数，不再强迫一高一低。非二元认同只由“关于你自己”的题计分，不把对他人的包容度混进去。': '这是一份偏娱乐向的自我观察测试。请按自己真实、长期的感觉作答，不需要猜“标准答案”。',
              'v4.x 答题复用': '本机答题记录',
              '完成答卷后会把最近记录压缩保存在本站 Cookie。以后 v4.x 更新时，只复用题目 ID 与 reuse key 都没变的答案；改过的题会重新让你回答。复用后仍可逐题修改。': '完成答卷后会把最近记录保存在本站 Cookie。之后可以继续使用最近答卷，也可以逐题修改。',
              'S/M-like 题继续只使用抽象、虚构、边界清楚且随时可停止的情境。13–15 岁不会出现四组 16+ 极端娱乐后缀；这些分数和所有娱乐文案都不是诊断或现实同意。': '部分题目涉及抽象的互动偏好情境；结果仅供娱乐和自我观察，不是诊断，也不代表现实中的同意或边界。',
              '独立叶片雷达 · v4.x 稳定题目迁移': '维度概览',
              '结果页叶片雷达': '维度雷达',
              'v4 独立维度雷达图': '维度雷达图',
              '非二元认同分只来自直接描述自己性别体验的题，不读取“你是否包容别人”“分类自由是否让你觉得社会更友好”之类题。': '这里展示的是各性别认同相关维度的分数，供你对照自己的实际体验。',
              'v4.x 历史记录': '本机答题记录',
              '复制码包含 v4.x 可迁移答案与结果；更新后只自动套用未变化的题。也可在控制台调用 <code>window.mf01smV4History</code>。': '答题码可用于备份或在兼容版本中继续使用；带着本次答案重看时仍可逐题修改。',
              "<script>/* mf01sm-v4-leaf-history */": '<script>',
              "$('#qNo').textContent='第 '+(state.index+1)+' / '+QUESTIONS.length+' 题 · '+(q.origin||'v4');": "$('#qNo').textContent='第 '+(state.index+1)+' / '+QUESTIONS.length+' 题';",
              '份已完成 v4.x 记录': '份已完成记录',
              '发现一份 v4.x 草稿。': '发现一份未完成草稿。',
              '本机还没有 v4.x 记录。': '本机还没有答题记录。',
              '本机还没有可复用的 v4.x 答卷。': '本机还没有可复用的答卷。',
              '清除本站保存的 v4.x 答题 Cookie？': '清除本站保存的答题 Cookie？',
              '不是有效的 mf01sm v4 答题码': '不是有效的 mf01sm 答题码',
              '粘贴 MF01SM4: 开头的答题码': '粘贴答题码',
          }
          for old, new in visible_replacements.items():
              replace_once(g, old, new)

          roast_replacements = {
              '第一页还把自己写在出生指派那一格，题目端的跨向分却已经把门牌拆了。v4 这次没有拿“你包不包容别人”偷给身份加分，所以这波冲突主要来自关于你自己身体、长期生活和被怎样理解的回答。查水表结论：嘴确实比分数硬，但它仍然不是身份判决书。': '第一页还把自己写在出生指派那一格，题目端的跨向分却已经把门牌拆了。这波冲突主要来自你关于自己身体、长期生活和被怎样理解的回答。查水表结论：嘴确实比分数硬，但它仍然不是身份判决书。',
              '这次“第四性”不是因为你觉得性别多元很酷，也不是因为你愿意尊重别人怎么自称。v4 的非二元分只吃“我自己是否完全落在男/女之一”这类直接题；所以它高起来，至少不再是包容度串台。': '“第四性”这组标签会跳出来，是因为你对自己是否完全落在男/女之一这类题的回答明显偏离二元一端。它更像一张自我体验截图，不是系统替你盖章。',
              '男吸引和女吸引是两根独立天线，不是一个滑杆左右抢地盘。现在两边一起亮灯时，“杂食”才有资格出来抢镜；不会再因为把一边拖高就自动把另一边压低。': '男吸引和女吸引两边一起亮灯，“杂食”这组标签就会出来抢镜。菜单看得宽不等于现实里一定要怎么行动，结果只是在描述这份答卷里的吸引方向。',
              '男吸引和女吸引两条独立天线都比较安静，所以低吸引标签不是靠“性表达得不明显”偷算出来的。浪漫倾向和性表达仍然各自单独算：想谈恋爱、怎么表达，与对谁产生吸引不是同一回事。': '男吸引和女吸引两边都比较安静，所以“纯爱战神 / 戒断圣体”这组标签会更容易出现。浪漫向往、亲密需要和身体层面的吸引仍然可能不是一回事。',
              'v4 最主要的变化是“不再强迫互斥”：0 和 1、男子气和女子气、S 和 M、男吸引和女吸引、单偶和多偶都能同时高、同时低。结果更像一片不规整的叶子，而不是把你硬塞进几个二选一滑杆。': '这张结果把不同偏好拆开看：有的维度会一起高，有的会一起低，也可能一边特别突出。别急着找唯一“阵营”，先看整张图长什么样。',
              '0 和 1 居然一起高：你不是“中间值”，而是两套模式都真能开。别人先来时你会接，没人动时你也能起手；旧版单轴最容易把这种人压成 50，v4 终于不再把双高误判成没特点。': '0 和 1 居然一起高：你不是“中间值”，而是两套模式都真能开。别人先来时你会接，没人动时你也能起手；这种人通常不是没特点，而是切换能力本身很突出。',
              'S/M-like 两边一起高，不再互相扣分，于是雷达直接长成双叶。究极缝合怪不是说矛盾，而是你对不同角色位置都能产生明显的虚构兴趣。': 'S/M-like 两边一起高，于是雷达直接长成双叶。究极缝合怪不是说矛盾，而是你对不同角色位置都能产生明显的虚构兴趣。',
              '审美这条终于从“女子气”里拆出来了：你对配色、材质、氛围、纪念物的敏感不再偷偷替性别风格加分。现在它可以自己堂堂正正长一片叶子。': '审美这条很亮：你对配色、材质、氛围、纪念物这些东西的敏感度相当抢镜。它不需要被解释成别的风格倾向，本身就是一条很有存在感的结果。',
              '这张雷达没有哪一根轴成功发动政变。重点不再是找一个唯一“阵营”，而是看哪些独立叶片一起长、哪些真的安静。': '这张雷达没有哪一根轴成功发动政变。重点不是找一个唯一“阵营”，而是看哪些叶片一起长、哪些真的安静。',
          }
          for old, new in roast_replacements.items():
              replace_once(g, old, new)

          replace_once(g, "if (!main.includes('mf01sm-v4-leaf-history') || !main.includes('结果页叶片雷达') || !main.includes('MF01SM4:')) throw new Error('v4 UI/history markers missing');", "if (!main.includes('radar-leaf') || !main.includes('维度雷达') || !main.includes('MF01SM4:')) throw new Error('v4 UI/history markers missing');")
          marker = "for (const tag of LOCKED_TAG_VOCABULARY) if (!main.includes(tag)) throw new Error(`Locked tag missing from v4 page: ${tag}`);"
          addition = marker + "\nconst forbiddenFrontendCopy = ['v4 把 0 / 1','reuse key','独立叶片雷达 · v4.x 稳定题目迁移','结果页叶片雷达','非二元认同分只来自','也可在控制台调用','旧版单轴','v4 终于','13–15 岁不会出现四组 16+ 极端娱乐后缀'];\nfor (const text of forbiddenFrontendCopy) if (main.includes(text)) throw new Error(`Developer-facing copy leaked into main page: ${text}`);\nif (main.includes('\\\"origin\\\":')) throw new Error('Question provenance leaked into browser questionnaire JSON');"
          replace_once(g, marker, addition)

          t = 'scripts/mf01sm-v4-regressions.mjs'
          replace_once(t, "assert.equal(V4_VERSION, '4.0.0');", "assert.equal(V4_VERSION, '4.0.1');")
          replace_once(t, "assert.match(MAIN_HTML,/v4\\.x 答题复用/);", "assert.ok(MAIN_HTML.includes('本机答题记录'));")
          replace_once(t, "assert.ok(MAIN_HTML.includes('结果页叶片雷达') && MAIN_HTML.includes('radar-leaf'));", "assert.ok(MAIN_HTML.includes('维度雷达') && MAIN_HTML.includes('radar-leaf'));")
          replace_once(t, "assert.ok(MAIN_HTML.includes('reused_ids:[...state.reusedIds]'));", "assert.ok(MAIN_HTML.includes('reused_ids:[...state.reusedIds]'));\nfor (const text of ['v4 把 0 / 1','reuse key','独立叶片雷达 · v4.x 稳定题目迁移','结果页叶片雷达','非二元认同分只来自','也可在控制台调用','旧版单轴','v4 终于','13–15 岁不会出现四组 16+ 极端娱乐后缀']) assert.ok(!MAIN_HTML.includes(text),`developer-facing copy leaked: ${text}`);\nassert.ok(!MAIN_HTML.includes('\\\"origin\\\":'),'question provenance must not be shipped in browser questionnaire JSON');\nassert.ok(!MAIN_HTML.includes("+(q.origin||'v4')"),'question header must not expose source provenance');")
          replace_once(t, "history:{source_version:'4.0.0'", "history:{source_version:'4.0.1'")

          print('4.0.1 frontend cleanup patch applied')
          PY
      - name: Generate and verify
        run: |
          pnpm build:mf01sm
          pnpm check
      - name: Commit verified 4.0.1 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/mf01sm-v401-ui-cleanup.yml
          git add -A
          git commit -m 'Clean developer-facing copy from mf01sm 4.0.1'
          git push origin HEAD:fix/mf01sm-v401-ui-cleanup
