name: mf01sm v4 bundle capture

on:
  push:
    branches: [feature/mf01sm-v4]
    paths:
      - .github/workflows/mf01sm-v4-bundle.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mf01sm-v4
          fetch-depth: 0
      - name: Assert v4 source is assembled
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/mf01sm/src/v4-model.js
          test -f scripts/mf01sm-v4-regressions.mjs
          test ! -d .v4parts
          grep -Fq 'mf01sm-v4-independent-leaf' apps/mf01sm/src/v4-model.js
          grep -Fq 'mf01sm-v4-leaf-history' scripts/generate-mf01sm-current.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify repository
        run: pnpm check
      - name: Capture exact Worker bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mf01sm-v4-out
          mkdir -p /tmp/mf01sm-v4-out
          pnpm --dir apps/web exec wrangler deploy --dry-run --cwd ../mf01sm --config wrangler.toml --name mf01sm --outdir /tmp/mf01sm-v4-out
          bundle="$(find /tmp/mf01sm-v4-out -type f -name '*.js' | head -n 1)"
          test -n "$bundle"
          cp "$bundle" /tmp/mf01sm-worker.js
          grep -Fq '4.0.0' /tmp/mf01sm-worker.js
          grep -Fq 'mf01sm-v4-independent-leaf' /tmp/mf01sm-worker.js
          grep -Fq 'mf01sm-v4-leaf-history' /tmp/mf01sm-worker.js
          wc -c /tmp/mf01sm-worker.js
          sha256sum /tmp/mf01sm-worker.js
      - name: Remove temporary capture workflow from feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/mf01sm-v4-bundle.yml
          git commit -m 'Remove temporary v4 bundle workflow'
          git push origin HEAD:feature/mf01sm-v4
      - name: Publish captured bundle to temporary build branch
        shell: bash
        run: |
          set -euo pipefail
          git switch -C build/mf01sm-v4-bundle
          mkdir -p .deploy
          cp /tmp/mf01sm-worker.js .deploy/mf01sm-worker.js
          {
            wc -c /tmp/mf01sm-worker.js
            sha256sum /tmp/mf01sm-worker.js
          } > .deploy/mf01sm-bundle-meta.txt
          git add -f .deploy/mf01sm-worker.js .deploy/mf01sm-bundle-meta.txt
          git commit -m 'Capture mf01sm v4.0.0 Worker bundle'
          git push --force origin HEAD:build/mf01sm-v4-bundle
