name: mf01sm v4 assemble

on:
  push:
    branches: [feature/mf01sm-v4]
    paths:
      - .v4parts/READY

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mf01sm-v4
      - name: Assemble v4 sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/mf01sm/src scripts
          cat .v4parts/m.* | base64 -d > apps/mf01sm/src/v4-model.js
          cat .v4parts/g.* | base64 -d > scripts/generate-mf01sm-current.mjs
          cat .v4parts/rt.* | base64 -d > apps/mf01sm/src/current-runtime.js
          cat .v4parts/t.* | base64 -d > scripts/mf01sm-v4-regressions.mjs
          cat .v4parts/d.* | base64 -d > scripts/deploy-mf01sm-runtime.mjs
          cat .v4parts/p.* | base64 -d > package.json
          node --check apps/mf01sm/src/v4-model.js
          node --check apps/mf01sm/src/current-runtime.js
          node --check scripts/generate-mf01sm-current.mjs
          node --check scripts/mf01sm-v4-regressions.mjs
          node --check scripts/deploy-mf01sm-runtime.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/mf01sm/src/v4-model.js apps/mf01sm/src/current-runtime.js scripts/generate-mf01sm-current.mjs scripts/mf01sm-v4-regressions.mjs scripts/deploy-mf01sm-runtime.mjs package.json
          git rm -r .v4parts .github/workflows/mf01sm-v4-assemble.yml
          git commit -m 'Build mf01sm v4 independent leaf model'
          git push origin HEAD:feature/mf01sm-v4
