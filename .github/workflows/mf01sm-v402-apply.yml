name: mf01sm 4.0.2 apply

on:
  push:
    branches: [feature/mf01sm-v4.0.2-stats-compat]
    paths:
      - .github/workflows/mf01sm-v402-apply.yml

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mf01sm-v4.0.2-stats-compat
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Lock questionnaire and scoring before patch
        shell: bash
        run: |
          node --input-type=module <<'NODE' > /tmp/v4-core-before.sha
          import {createHash} from 'node:crypto';
          import {V4_QUESTIONS,scoreV4Answers,classifyV4Result} from './apps/mf01sm/src/v4-model.js';
          const stable=JSON.stringify({q:V4_QUESTIONS,score:scoreV4Answers.toString(),classify:classifyV4Result.toString()});
          console.log(createHash('sha256').update(stable).digest('hex'));
          NODE
      - name: Normalize patch matcher escaping
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.tmp/mf01sm-v402-patch.py')
          lines=p.read_text().splitlines()
          out=[]; in_intro=False
          for line in lines:
              if line.startswith('intro_re = re.compile'):
                  line='intro_re = re.compile(r\'<section id="intro" class="card stack">.*?</section>\\n<section id="quiz"\', re.S)'
              elif line.startswith("intro_new = r'''"):
                  in_intro=True
                  line=line.replace('\\"','"')
              elif in_intro:
                  line=line.replace('\\"','"')
                  if line.rstrip().endswith("'''"):
                      in_intro=False
              elif line.startswith('needle = '):
                  line='needle = \'<div class="result-block"><h3>结果页“打脸”解析</h3><div id="roast"></div></div>\''
              elif line.startswith('make_re = re.compile'):
                  line="make_re = re.compile(r'function makeEntry\\(complete,scores=null,result=null\\)\\{.*?\\}\\nfunction scheduleDraft', re.S)"
              elif line.startswith('apply_re = re.compile'):
                  line="apply_re = re.compile(r'function applyEntry\\(entry\\)\\{.*?return reused;\\}', re.S)"
              elif line.startswith('profile_re = re.compile'):
                  line='profile_re = re.compile(r"function collectProfile\\(\\)\\{.*?\\$\\(\'#introNext\'\\)\\.addEventListener\\(\'click\',\\(\\)=>\\{.*?show\\(\'quiz\'\\);\\}\\);", re.S)'
              out.append(line)
          p.write_text('\n'.join(out)+'\n')
          PY
      - name: Syntax check patch
        run: python3 -m py_compile .tmp/mf01sm-v402-patch.py
      - name: Apply focused patch
        run: python3 .tmp/mf01sm-v402-patch.py
      - name: Keep generated question JSON boundary intact
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/generate-mf01sm-current.mjs')
          s=p.read_text()
          old="const QUESTIONS=${questionsJson};const ANSWER_COMPAT=${answerCompatJson};const SCORE_KEYS=${scoreKeysJson};const RADAR_AXES=${radarJson};"
          new="const QUESTIONS=${questionsJson};const SCORE_KEYS=${scoreKeysJson};const ANSWER_COMPAT=${answerCompatJson};const RADAR_AXES=${radarJson};"
          if s.count(old)!=1: raise SystemExit('generator constant-order target mismatch')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Prove questionnaire scoring and tags were untouched
        shell: bash
        run: |
          node --input-type=module <<'NODE' > /tmp/v4-core-after.sha
          import {createHash} from 'node:crypto';
          import {V4_QUESTIONS,scoreV4Answers,classifyV4Result} from './apps/mf01sm/src/v4-model.js';
          const stable=JSON.stringify({q:V4_QUESTIONS,score:scoreV4Answers.toString(),classify:classifyV4Result.toString()});
          console.log(createHash('sha256').update(stable).digest('hex'));
          NODE
          cmp /tmp/v4-core-before.sha /tmp/v4-core-after.sha
      - run: pnpm install --frozen-lockfile
      - name: Full repository check
        run: pnpm check
      - name: Commit verified 4.0.2 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .tmp/mf01sm-v402-patch.py .github/workflows/mf01sm-v402-apply.yml
          git add apps/mf01sm/src/v4-model.js apps/mf01sm/src/current-runtime.js scripts/generate-mf01sm-current.mjs scripts/mf01sm-v4-regressions.mjs scripts/deploy-mf01sm-runtime.mjs
          git commit -m 'Restore self-report statistics in mf01sm 4.0.2'
          git push origin HEAD:feature/mf01sm-v4.0.2-stats-compat
