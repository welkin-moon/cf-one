name: mf01sm v4 recover

on:
  push:
    branches: [fix/mf01sm-v4-recover]
    paths:
      - .github/workflows/mf01sm-v4-recover.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mf01sm-v4-recover
          fetch-depth: 0
      - name: Reconstruct and byte-verify exact v4 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/mf01sm/src scripts
          decode_parts() {
            out="$1"; shift
            : > "$out"
            for f in "$@"; do base64 -d "$f" >> "$out"; done
          }
          decode_parts apps/mf01sm/src/v4-model.js .v4parts/model.000 .v4parts/model.001 .v4parts/model.002 .v4parts/model.003
          decode_parts scripts/generate-mf01sm-current.mjs .v4parts/g.000 .v4parts/g.001 .v4parts/g.002 .v4parts/g003.0 .v4parts/g003.1 .v4parts/g.004 .v4parts/g.005 .v4parts/g006.0 .v4parts/g006.1 .v4parts/g.007 .v4parts/g.008
          decode_parts apps/mf01sm/src/current-runtime.js .v4parts/rt.000 .v4parts/rt.001
          decode_parts scripts/mf01sm-v4-regressions.mjs .v4parts/tt.0 .v4parts/tt.1 .v4parts/tt.2 .v4parts/tt.3
          decode_parts scripts/deploy-mf01sm-runtime.mjs .v4parts/d.000 .v4parts/d.001
          decode_parts package.json .v4parts/p.000
          cat > /tmp/v4.sha256 <<'EOF'
          5112b0cedd9f6a6340d6327f1f371f8bf33ece64015a0987f5249738a19767d3  apps/mf01sm/src/v4-model.js
          b1d8d1b41623e2fcdaedc90bca19ec2affbe81e0e9bba66bae6f95487f42673c  apps/mf01sm/src/current-runtime.js
          150e308db797c6aecaaf33eb035156a13e5a156467f362a3eea98941360db078  scripts/generate-mf01sm-current.mjs
          16d38aeb4f2a7a7bcba4c7f61d741bf6e2cb3ef02366aa754799dc17b5fc8c21  scripts/mf01sm-v4-regressions.mjs
          217e1d74d8adff985c3a2f6a6a9d1264ea8d2cf0f9dc5bf1f3432988d68c553f  scripts/deploy-mf01sm-runtime.mjs
          b25df00bf690fcf59d597291ae3e57d2aec08338c871131a3d5c62743278a729  package.json
          EOF
          sha256sum -c /tmp/v4.sha256
          node --check apps/mf01sm/src/v4-model.js
          node --check apps/mf01sm/src/current-runtime.js
          node --check scripts/generate-mf01sm-current.mjs
          node --check scripts/mf01sm-v4-regressions.mjs
          node --check scripts/deploy-mf01sm-runtime.mjs
          node scripts/generate-mf01sm-current.mjs
          node scripts/mf01sm-v4-regressions.mjs
          grep -Fq "const VERSION = '4.0.0'" apps/mf01sm/src/current-runtime.js
          grep -Fq "mf01sm-v4-independent-leaf" apps/mf01sm/src/v4-model.js
          grep -Fq "mf01sm-v4-leaf-history" scripts/generate-mf01sm-current.mjs
          grep -Fq "mf01sm-v4-regressions.mjs" package.json
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Full repository verification
        run: pnpm check
      - name: Commit only real v4 source and remove broken transfer scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -rf .v4parts
          rm -f \
            .github/workflows/mf01sm-v4-assemble.yml \
            .github/workflows/mf01sm-v4-bundle.yml \
            .github/workflows/mf01sm-v4-finalize.yml \
            .github/workflows/mf01sm-v4-promote.yml \
            .github/workflows/mf01sm-v4-stage-upload.yml \
            .github/workflows/mf01sm-v4-recover.yml
          git add -A
          git commit -m 'Recover actual mf01sm v4.0.0 source'
          git push origin HEAD:fix/mf01sm-v4-recover
