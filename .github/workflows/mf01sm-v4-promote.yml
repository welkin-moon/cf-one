name: mf01sm v4 promote

on:
  push:
    branches: [feature/mf01sm-v4]
    paths:
      - .github/workflows/mf01sm-v4-promote.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  verify-and-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mf01sm-v4
          fetch-depth: 0
      - name: Assert assembly completed
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/mf01sm/src/v4-model.js
          test -f scripts/mf01sm-v4-regressions.mjs
          test ! -d .v4parts
          grep -Fq "mf01sm-v4-independent-leaf" apps/mf01sm/src/v4-model.js
          grep -Fq "mf01sm-v4-leaf-history" scripts/generate-mf01sm-current.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Full repository check
        run: pnpm check
      - name: Remove temporary promotion workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/mf01sm-v4-promote.yml
          git commit -m 'Remove temporary v4 promotion workflow'
          git push origin HEAD:feature/mf01sm-v4
      - name: Create or merge pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh pr list --head feature/mf01sm-v4 --base main --state open --json number --jq '.[0].number')"
          if [ -z "$pr" ]; then
            gh pr create --base main --head feature/mf01sm-v4 --title 'Build mf01sm v4 independent leaf model' --body 'Reuse-first mf01sm v4.0.0: independent leaf scoring, direct nonbinary identity, aesthetics, 13-leaf radar, blurred flag, complete stats, and v4.x reusable answer history.'
            pr="$(gh pr list --head feature/mf01sm-v4 --base main --state open --json number --jq '.[0].number')"
          fi
          gh pr merge "$pr" --squash --subject 'Build mf01sm v4 independent leaf model' --body 'Reuse-first v4.0.0 with stable v3.8/v2-style item inheritance, independent result leaves, complete statistics, and portable v4.x answer migration.'
