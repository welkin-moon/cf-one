name: mf01sm v4.0.4 orchestrate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mf01sm-v404-orchestrate.yml

permissions:
  contents: write

jobs:
  patch-verify-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch repair branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/mf01sm-v4.0.4-result-coherence
          git switch -C fix/mf01sm-v4.0.4-result-coherence origin/fix/mf01sm-v4.0.4-result-coherence
          python - <<'PY'
          from pathlib import Path
          def replace_once(path, old, new):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n!=1: raise SystemExit(f'{path}: expected one match, got {n}: {old[:80]!r}')
              p.write_text(s.replace(old,new,1))
          replace_once('apps/mf01sm/src/v4-model.js', "export const V4_VERSION = '4.0.3';", "export const V4_VERSION = '4.0.4';")
          replace_once('apps/mf01sm/src/current-runtime.js', "const VERSION = '4.0.3';", "const VERSION = '4.0.4';")
          replace_once('scripts/deploy-mf01sm-runtime.mjs', "const VERSION = '4.0.3';", "const VERSION = '4.0.4';")
          replace_once('scripts/deploy-mf01sm-runtime.mjs', "'4.0.3'", "'4.0.4'")
          replace_once('scripts/deploy-mf01sm-runtime.mjs', 'mf01sm v4.0.3 required location permission before questionnaire entry', 'mf01sm v4.0.4 coherent mixed-attraction result classification and location gate')
          replace_once('scripts/mf01sm-v4-regressions.mjs', "assert.equal(V4_VERSION, '4.0.3');", "assert.equal(V4_VERSION, '4.0.4');")
          old="""  const attM = Number(scores.attr_m || 0), attF = Number(scores.attr_f || 0);
  const panish = attM >= 56 && attF >= 56 && Math.abs(attM - attF) <= 18;
  const aceish = Math.max(attM, attF) <= 34;
  const cross = Number(scores.gender_cross || 0) >= 64 && Number(scores.gender_cross || 0) - Number(scores.gender_aligned || 0) >= 14;
  const agender = Number(scores.nonbinary_identity || 0) >= 76 && Number(scores.nonbinary_identity || 0) >= Math.max(Number(scores.gender_aligned || 0), Number(scores.gender_cross || 0)) + 8;

  let left;
  if (agender) left = '第四性 / 电子盆栽';
  else if (cross && amab) left = attM >= attF + 18 ? '软糯小蓝梁 / 蓝梁诱捕器' : '里百合 / 药娘预备役 / 软糯伪娘';
  else if (cross && !amab) left = attF >= attM + 18 ? '铁T / 姬圈老保' : '√-16先锋 / 腐改跨';
  else if (aceish) left = '纯爱战神 / 戒断圣体';
  else if (panish) left = '杂食恶犬 / 荤素不忌';
  else if (amab && attM >= 50 && attM >= attF + 18) left = '击剑爱好者 / 哇是成都人';
  else if (!amab && attF >= 50 && attF >= attM + 18) left = '柑橘味香女 / 兰州特产';
  else if (amab && attF >= attM) left = '平平无奇顺直男';
  else if (!amab && attM >= attF) left = '普通顺直女';
  else if (amab) left = '击剑爱好者 / 哇是成都人';
  else left = '柑橘味香女 / 兰州特产';
"""
          new="""  const attM = Number(scores.attr_m || 0), attF = Number(scores.attr_f || 0);
  const attractionGap = Math.abs(attM - attF);
  const aceish = Math.max(attM, attF) <= 34;
  const mixedAttraction = !aceish && attractionGap <= 18;
  const panish = mixedAttraction && attM >= 56 && attF >= 56;
  const alignedScore = Number(scores.gender_aligned || 0), crossScore = Number(scores.gender_cross || 0);
  const aligned = alignedScore >= 64 && alignedScore - crossScore >= 14;
  const cross = crossScore >= 64 && crossScore - alignedScore >= 14;
  const agender = Number(scores.nonbinary_identity || 0) >= 76 && Number(scores.nonbinary_identity || 0) >= Math.max(alignedScore, crossScore) + 8;

  let left;
  if (agender) left = '第四性 / 电子盆栽';
  else if (cross && amab) left = attM >= attF + 18 ? '软糯小蓝梁 / 蓝梁诱捕器' : '里百合 / 药娘预备役 / 软糯伪娘';
  else if (cross && !amab) left = attF >= attM + 18 ? '铁T / 姬圈老保' : '√-16先锋 / 腐改跨';
  else if (aceish) left = '纯爱战神 / 戒断圣体';
  else if (mixedAttraction) left = '杂食恶犬 / 荤素不忌';
  else if (amab && attM > attF) left = '击剑爱好者 / 哇是成都人';
  else if (!amab && attF > attM) left = '柑橘味香女 / 兰州特产';
  else if (amab) left = '平平无奇顺直男';
  else left = '普通顺直女';
"""
          replace_once('apps/mf01sm/src/v4-model.js', old, new)
          replace_once('apps/mf01sm/src/v4-model.js', "chips.push(agender ? '非二元认同高' : cross ? '跨指派倾向明显' : '性别方向较混合');", "chips.push(agender ? '非二元认同高' : cross ? '跨指派倾向明显' : aligned ? '出生指派方向明显' : '性别方向较混合');")
          replace_once('apps/mf01sm/src/v4-model.js', "else if (panish) flag = 'linear-gradient(135deg,#d60270 0%,#9b4f96 50%,#0038a8 100%)';", "else if (mixedAttraction) flag = 'linear-gradient(135deg,#d60270 0%,#9b4f96 50%,#0038a8 100%)';")
          replace_once('apps/mf01sm/src/v4-model.js', "flags: {agender,cross,panish,aceish,smEligible}", "flags: {agender,aligned,cross,mixedAttraction,panish,aceish,smEligible}")
          replace_once('scripts/generate-mf01sm-current.mjs', "[lx,ly]=point(i,r+36),[vx,vy]=point(i,r+20)", "[lx,ly]=point(i,r+28),[vx,vy]=point(i,r+14)")
          anchor="""r = classifyV4Result({...baseScores,attr_m:20,attr_f:20,sexual_expression:100},{assignGender:'AMAB',age:16});
assert.ok(r.tag.startsWith('纯爱战神 / 戒断圣体 · '),'low attraction classification must not be suppressed by high expression');
"""
          extra=anchor+"""
r = classifyV4Result({...baseScores,gender_aligned:67,gender_cross:33,nonbinary_identity:58,attr_m:50,attr_f:50,role0:60,role1:45,s_like:42,m_like:50,aesthetic:75,mono:75,poly:75},{assignGender:'AFAB',age:16});
assert.ok(r.tag.startsWith('杂食恶犬 / 荤素不忌 · '),'mixed attraction must not be forced into 普通顺直女');
assert.ok(r.tag.endsWith('端水大师 / 薛定谔的XP'));
assert.ok(r.chips.includes('出生指派方向明显'));
assert.ok(r.chips.includes('吸引方向混合'));
r = classifyV4Result({...baseScores,gender_aligned:75,gender_cross:25,attr_m:50,attr_f:63},{assignGender:'AFAB',age:16});
assert.ok(r.tag.startsWith('杂食恶犬 / 荤素不忌 · '));
r = classifyV4Result({...baseScores,gender_aligned:83,gender_cross:42,attr_m:75,attr_f:0},{assignGender:'AFAB',age:16});
assert.ok(r.tag.startsWith('普通顺直女 · '));
"""
          replace_once('scripts/mf01sm-v4-regressions.mjs', anchor, extra)
          replace_once('scripts/mf01sm-v4-regressions.mjs', "assert.ok(MAIN_HTML.includes('维度雷达') && MAIN_HTML.includes('radar-leaf'));", "assert.ok(MAIN_HTML.includes('维度雷达') && MAIN_HTML.includes('radar-leaf'));\nassert.ok(MAIN_HTML.includes('[lx,ly]=point(i,r+28),[vx,vy]=point(i,r+14)'),'radar labels must stay inside the mobile card');")
          PY
          node --check apps/mf01sm/src/v4-model.js
          node scripts/generate-mf01sm-current.mjs
          node scripts/mf01sm-v4-regressions.mjs
          pnpm check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/mf01sm-v404-result.yml || true
          git add apps/mf01sm/src/v4-model.js apps/mf01sm/src/current-runtime.js scripts/generate-mf01sm-current.mjs scripts/mf01sm-v4-regressions.mjs scripts/deploy-mf01sm-runtime.mjs
          git commit -m 'Fix mf01sm v4.0.4 result coherence'
          git push origin HEAD:fix/mf01sm-v4.0.4-result-coherence
      - name: Remove orchestrator from main
        shell: bash
        run: |
          set -euo pipefail
          git switch -C main origin/main
          git rm .github/workflows/mf01sm-v404-orchestrate.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Remove temporary mf01sm v4.0.4 orchestrator'
          git push origin HEAD:main
