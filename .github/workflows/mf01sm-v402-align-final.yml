name: mf01sm 4.0.2 align final

on:
  push:
    branches: [feature/mf01sm-v4.0.2-stats-compat]
    paths:
      - .github/workflows/mf01sm-v402-align-final.yml

permissions:
  contents: write

jobs:
  align-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mf01sm-v4.0.2-stats-compat
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply exact 3.8.2 baseline alignment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('scripts/generate-mf01sm-current.mjs')
          s=p.read_text()

          def once(old,new,label):
              global s
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1, got {n}')
              s=s.replace(old,new,1)

          def between(start,end,replacement,label):
              global s
              i=s.find(start)
              if i<0: raise SystemExit(f'{label}: start missing')
              j=s.find(end,i+len(start))
              if j<0: raise SystemExit(f'{label}: end missing')
              if s.find(start,i+1)>=0: raise SystemExit(f'{label}: start not unique')
              s=s[:i]+replacement+s[j:]

          between(
              '<div class="axis-field" data-axis="sexual_expression">',
              '<div class="axis-field" data-axis="romantic_tendency">',
              '<div class="axis-field" data-axis="libido"><div class="axis-heading"><b>性欲望 / 性冲动强度</b><output class="axis-value">未选择</output></div><input class="spectrum-range" type="range" min="0" max="1" step="0.001" value="0.5" aria-label="性欲望强度连续轴"><div class="axis-labels"><span>低欲望</span><span>普通</span><span>高欲望</span></div></div>\n',
              'sexual expression -> libido baseline')
          between('\n<div class="field"><span class="label">0 / 1 自我感觉','\n<div class="actions"><button id="baselineNext"','','remove role controls')
          once('selfLikert:{role01:[]}','selfLikert:{}','self stats state')
          once("const SELF_STAT_KEYS=['gender_expression','sexual_attraction_direction','sexual_attraction_intensity','sexual_expression','romantic_tendency','relationship_structure'];","const SELF_STAT_KEYS=['gender_expression','sexual_attraction_direction','sexual_attraction_intensity','libido','romantic_tendency','relationship_structure'];",'self stat keys')
          once("});$('#selfRole0').checked=(state.selfLikert.role01||[]).includes('0');$('#selfRole1').checked=(state.selfLikert.role01||[]).includes('1');refreshSelfLabels();","});refreshSelfLabels();",'role sync')
          s,n=re.subn(r"const updateRoleStats=\(\)=>\{.*?\$\('#selfRole1'\)\.addEventListener\('change',updateRoleStats\);",'',s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'role listeners: {n}')
          once("const genderSelected=Number.isFinite(state.selfLikert.gender_identity)||!!state.selfLikert.gender_identity_special,missing=SELF_STAT_KEYS.filter(key=>!Number.isFinite(state.selfLikert[key]));state.selfLikert.role01=[...($('#selfRole0').checked?['0']:[]),...($('#selfRole1').checked?['1']:[])];","const genderSelected=Number.isFinite(state.selfLikert.gender_identity)||!!state.selfLikert.gender_identity_special,missing=SELF_STAT_KEYS.filter(key=>!Number.isFinite(state.selfLikert[key]));",'role collection')
          once("if(!state.selfLikert.role01.length)return alert('0 / 1 自我感觉至少选一项；两项都可以选。');",'', 'role validation')

          # Normalize comparison card markup.
          label=s.find('自我定位 ↔ 题目画像')
          if label<0: raise SystemExit('comparison card label missing')
          left=s.rfind('<div ',0,label); right=s.find('</div></div>',label)
          if left<0 or right<0: raise SystemExit('comparison card bounds missing')
          right+=len('</div></div>')
          s=s[:left]+'<div class="result-block"><h3>自我定位 ↔ 题目画像</h3><div id="selfCompare" class="axis-compare"></div></div>'+s[right:]

          comparison="""function buildSelfComparison(scores){const clamp01=v=>Math.max(0,Math.min(1,Number(v)||0)),fmt=v=>Number(v).toFixed(3),self=state.selfLikert||{},amab=state.assignGender==='AMAB',gMale=amab?scores.gender_aligned:scores.gender_cross,gFemale=amab?scores.gender_cross:scores.gender_aligned,gNb=scores.nonbinary_identity,gDen=gMale+gFemale+gNb,test={gender_identity:gDen>0?(gFemale+gNb*.5)/gDen:.5,gender_expression:clamp01(.5+(scores.gender_style_fem-scores.gender_style_masc)/200),sexual_attraction_direction:(scores.attr_m+scores.attr_f)>0?scores.attr_f/(scores.attr_m+scores.attr_f):.5,sexual_attraction_intensity:Math.max(scores.attr_m,scores.attr_f)/100,romantic_tendency:scores.romantic_tendency/100,relationship_structure:clamp01(.5+(scores.poly-scores.mono)/200)},defs=[['gender_identity','性别认同'],['gender_expression','性别表达'],['sexual_attraction_direction','性吸引方向'],['sexual_attraction_intensity','性吸引强度'],['libido','性欲望 / 性冲动'],['romantic_tendency','浪漫倾向'],['relationship_structure','关系结构']];let html='<div class=\"axis-compare-row axis-compare-head\"><b>光谱</b><span>自我定位</span><span>题目画像</span><span>差值</span></div>';for(const [key,label] of defs){const special=key==='gender_identity'&&self.gender_identity_special,sv=Number.isFinite(self[key])?Number(self[key]):null,tv=key==='libido'?null:clamp01(test[key]),selfText=special?(SPECIAL_LABELS[self.gender_identity_special]||self.gender_identity_special):(sv===null?'—':fmt(sv)),testText=tv===null?'—':fmt(tv),gap=sv===null||tv===null?'—':fmt(Math.abs(tv-sv));html+='<div class=\"axis-compare-row\"><b>'+label+'</b><span>'+selfText+'</span><span>'+testText+'</span><span>'+(gap==='—'?'—':'Δ '+gap)+'</span></div>';}return html;}\nfunction roastV4"""
          s,n=re.subn(r'function buildSelfComparison\(scores\)\{.*?\}\nfunction roastV4',comparison,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'comparison function: {n}')

          once("if (!main.includes('0 / 1 自我感觉（可多选，但至少选一项）')) throw new Error('v4 0/1 multi-select baseline missing');","if (!main.includes('data-axis=\\\"libido\\\"') || main.includes('id=\\\"selfRole0\\\"') || main.includes('id=\\\"selfRole1\\\"')) throw new Error('3.8.2-style independent self-report baseline mismatch');",'generator baseline guard')
          p.write_text(s)

          p=Path('scripts/mf01sm-v4-regressions.mjs')
          s=p.read_text()
          def test_once(old,new,label):
              global s
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1, got {n}')
              s=s.replace(old,new,1)
          test_once("for (const key of ['gender_expression','sexual_attraction_direction','sexual_attraction_intensity','sexual_expression','romantic_tendency','relationship_structure'])","for (const key of ['gender_expression','sexual_attraction_direction','sexual_attraction_intensity','libido','romantic_tendency','relationship_structure'])",'axis test')
          test_once("assert.ok(MAIN_HTML.includes('0 / 1 自我感觉（可多选，但至少选一项）'));","assert.ok(!MAIN_HTML.includes('id=\\\"selfRole0\\\"') && !MAIN_HTML.includes('id=\\\"selfRole1\\\"'),'3.8.2 self-report page must not grow questionnaire 0/1 controls');",'role test')
          test_once("sexual_attraction_intensity:0.37,sexual_expression:0.22,romantic_tendency:0.89,relationship_structure:0.18,role01:['0','1']","sexual_attraction_intensity:0.37,libido:0.22,romantic_tendency:0.89,relationship_structure:0.18",'fixture')
          marker="assert.ok(MAIN_HTML.includes('维度雷达') && MAIN_HTML.includes('radar-leaf'));"
          if s.count(marker)!=1: raise SystemExit('comparison markup insertion point missing')
          s=s.replace(marker,marker+"\nassert.ok(MAIN_HTML.includes('<div class=\\\"result-block\\\"><h3>自我定位 ↔ 题目画像</h3>'),'comparison card must render as valid HTML');\nassert.ok(!MAIN_HTML.includes('class=\\\\\\\"result-block\\\\\\\"><h3>自我定位 ↔ 题目画像'),'comparison card must not contain literal generator escapes');",1)
          p.write_text(s)
          PY
      - run: pnpm install --frozen-lockfile
      - name: Full repository check
        run: pnpm check
      - name: Commit clean aligned source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/mf01sm-v402-align-stats.yml .github/workflows/mf01sm-v402-align-final.yml
          git add scripts/generate-mf01sm-current.mjs scripts/mf01sm-v4-regressions.mjs
          git commit -m 'Match mf01sm 4.0.2 self-report to 3.8.2 spectrum'
          git push origin HEAD:feature/mf01sm-v4.0.2-stats-compat
